<style>
  :root{
    --sumi:#1c1c1a;
    --shiro:#fbfaf7;
    --usuzumi:#8a8a84;
    --keisen:#d8d6cf;
    --base-fill:#ffffff;
    --maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","HG丸ｺﾞｼｯｸM-PRO","Yu Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--shiro);
    color:var(--sumi);
    display:flex;flex-direction:column;
    height:100dvh;
    user-select:none;-webkit-user-select:none;
  }

  header{
    display:flex;align-items:center;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    border-bottom:1px solid var(--keisen);
    background:var(--shiro);
    z-index:10;
  }
  header h1{
    font-family:var(--maru);
    font-size:16px;font-weight:700;letter-spacing:.04em;
    white-space:nowrap;flex:0 1 auto;min-width:0;
  }
  .count{
    font-size:12px;color:#6e6d67;letter-spacing:.04em;
    margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;
  }
  .count b{color:var(--sumi);font-size:15px;font-weight:700}
  .hbtn{
    border:1.5px solid #b0aea5;background:#ffffff;color:#45443f;
    font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;letter-spacing:.04em;
    font-family:inherit;white-space:nowrap;flex:0 0 auto;
  }
  .hbtn:active{background:#eeece6}
  .hbtn.on{background:var(--sumi);color:#fff;border-color:var(--sumi)}
  .hbtn:disabled{opacity:.5}

  /* 保存オーバーレイ */
  #saveOverlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(28,28,26,.55);
    display:none;align-items:center;justify-content:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  #saveOverlay.show{display:flex}
  .save-card{
    background:var(--shiro);border-radius:18px;
    width:100%;max-width:460px;max-height:100%;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .save-head{
    display:flex;align-items:center;gap:8px;
    padding:14px 16px 10px;border-bottom:1px solid var(--keisen);
  }
  .save-title{font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.1em}
  .save-close{
    margin-left:auto;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--keisen);background:transparent;color:var(--usuzumi);
    font-size:18px;line-height:1;
  }
  .save-close:active{background:#eeece6}
  .save-note{
    font-family:var(--maru);font-size:12px;color:var(--usuzumi);
    line-height:1.7;padding:10px 16px 4px;
  }
  .save-imgwrap{
    flex:1;overflow:auto;padding:4px 16px 12px;
    display:flex;align-items:center;justify-content:center;
  }
  #saveImg{
    max-width:100%;height:auto;border-radius:10px;
    border:1px solid var(--keisen);background:#fff;
    -webkit-touch-callout:default;
  }
  .save-dl{
    display:block;text-align:center;text-decoration:none;
    font-family:var(--maru);font-weight:700;font-size:14px;letter-spacing:.08em;
    background:var(--sumi);color:#fff;
    padding:14px;margin:0 16px calc(16px + env(safe-area-inset-bottom));
    border-radius:999px;
  }
  .save-dl:active{opacity:.85}

  #stage{
    flex:1;position:relative;overflow:hidden;
    touch-action:none;
    background:
      radial-gradient(circle at 30% 20%, #ffffff 0%, transparent 60%),
      var(--shiro);
  }
  #panzoom{position:absolute;inset:0;transform-origin:0 0}
  svg.geolonia-svg-map{width:100%;height:100%;display:block}
  .prefecture{fill:var(--base-fill);cursor:pointer}
  .prefecture polygon,.prefecture path{stroke:#3a3a36;stroke-width:1}
  .prefecture.flash polygon,.prefecture.flash path{stroke:#000;stroke-width:2.4}
  .boundary-line{stroke:#b9b7af;stroke-dasharray:3 4}

  .pref-label{
    font-family:var(--maru);
    font-weight:700;
    fill:#33322e;
    stroke:#ffffff;stroke-width:3;
    paint-order:stroke;
    stroke-linejoin:round;
    pointer-events:none;
    text-anchor:middle;
    dominant-baseline:central;
  }
  body.labels-off .pref-label{display:none}

  .zoom-ctrl{
    position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:5;
  }
  .zoom-ctrl button{
    width:40px;height:40px;border-radius:50%;
    border:1px solid var(--keisen);background:rgba(255,255,255,.92);
    font-size:20px;color:var(--sumi);line-height:1;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .zoom-ctrl button:active{background:#eeece6}

  #toast{
    position:absolute;left:50%;top:12px;transform:translateX(-50%) translateY(-6px);
    background:rgba(28,28,26,.88);color:#fff;
    font-size:12px;letter-spacing:.1em;
    padding:7px 16px;border-radius:999px;
    opacity:0;transition:opacity .18s,transform .18s;
    pointer-events:none;white-space:nowrap;z-index:6;
    font-family:var(--maru);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid rgba(255,255,255,.5)}

  .tray{
    border-top:1px solid var(--keisen);
    background:var(--shiro);
    padding:10px 0 max(10px, env(safe-area-inset-bottom));
  }
  .tray-scroll{
    display:flex;gap:6px;overflow-x:auto;padding:2px 14px 4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tray-scroll::-webkit-scrollbar{display:none}
  .swatch{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;
    background:none;border:none;font-family:inherit;padding:4px 5px;border-radius:10px;
  }
  .swatch .chip{
    width:38px;height:38px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.12);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);
    transition:transform .12s;
  }
  .swatch .nm{
    font-size:10px;color:var(--usuzumi);letter-spacing:.04em;white-space:nowrap;
    font-family:var(--maru);
  }
  .swatch.sel .chip{transform:scale(1.12);border-color:var(--sumi);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 0 2px var(--shiro),0 0 0 3.5px var(--sumi)}
  .swatch.sel .nm{color:var(--sumi);font-weight:700}
  .chip.eraser{
    background:
      linear-gradient(135deg, transparent 46%, #c0392b 46%, #c0392b 54%, transparent 54%),
      #fff;
  }
  .chip.custom-chip{position:relative;overflow:hidden;background:conic-gradient(#e74c3c,#f39c12,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c)}
  .chip.custom-chip input{
    position:absolute;inset:-8px;width:60px;height:60px;opacity:0;border:none;padding:0;
  }
</style>

  <div id="toast"><span class="dot" id="toastDot"></span><span id="toastText"></span></div>
  <div class="zoom-ctrl">
    <button id="zin" aria-label="拡大">＋</button>
    <button id="zout" aria-label="縮小">－</button>
  </div>
</div>

<div class="tray">
  <div class="tray-scroll" id="tray"></div>
</div>

<script>
(function(){
  /* ---------- 伝統色パレット ---------- */
  const COLORS = [
    {name:'茜色',   hex:'#B7282E'},
    {name:'橙色',   hex:'#EE7800'},
    {name:'山吹色', hex:'#F8B500'},
    {name:'若竹色', hex:'#68BE8D'},
    {name:'常磐色', hex:'#007B43'},
    {name:'浅葱色', hex:'#00A3AF'},
    {name:'藍色',   hex:'#165E83'},
    {name:'藤色',   hex:'#8B81C3'},
    {name:'桜色',   hex:'#F4B3C2'},
    {name:'葡萄色', hex:'#640125'},
    {name:'鈍色',   hex:'#727171'},
  ];
  let current = {name:'茜色', hex:'#B7282E'};
  let eraser = false;
  const painted = new Map();

  /* ---------- トレイ生成 ---------- */
  const tray = document.getElementById('tray');
  function mkSwatch(inner, nm){
    const b = document.createElement('button');
    b.className = 'swatch';
    b.innerHTML = inner + '<span class="nm">'+nm+'</span>';
    tray.appendChild(b);
    return b;
  }
  const swatchEls = [];
  COLORS.forEach(c=>{
    const b = mkSwatch('<span class="chip" style="background:'+c.hex+'"></span>', c.name);
    b.addEventListener('click', ()=>{ current=c; eraser=false; select(b); });
    swatchEls.push(b);
  });
  const customBtn = mkSwatch('<span class="chip custom-chip"><input type="color" id="customColor" value="#ff6600"></span>', '自由な色');
  swatchEls.push(customBtn);
  const customInput = customBtn.querySelector('input');
  customInput.addEventListener('input', e=>{
    current = {name:'自由な色', hex:e.target.value};
    eraser=false; select(customBtn);
    customBtn.querySelector('.chip').style.background = e.target.value;
  });
  customBtn.addEventListener('click', ()=>{
    current = {name:'自由な色', hex:customInput.value};
    eraser=false; select(customBtn);
  });
  const eraserBtn = mkSwatch('<span class="chip eraser"></span>', '消す');
  swatchEls.push(eraserBtn);
  eraserBtn.addEventListener('click', ()=>{ eraser=true; select(eraserBtn); });

  function select(el){ swatchEls.forEach(s=>s.classList.toggle('sel', s===el)); }
  select(swatchEls[0]);

  /* ---------- 県名ラベル(SVGに埋め込み済み)+ トグル ---------- */
  const prefs = Array.from(document.querySelectorAll('g.prefecture'));
  function nameOf(g){
    const t = g.querySelector('title');
    return t ? t.textContent.split('/')[0].trim() : '';
  }
  /* ---------- 保存(端末内に塗り状態を記録) ---------- */
  const STORE_KEY = 'nurie-japan-v1';
  const LABEL_KEY = 'nurie-japan-labels-v1';
  function saveState(){
    try{
      const obj = {};
      painted.forEach((hex,code)=>{ obj[code]=hex; });
      localStorage.setItem(STORE_KEY, JSON.stringify(obj));
    }catch(e){ /* プライベートモード等では保存できないことがある */ }
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return;
      const obj = JSON.parse(raw);
      Object.keys(obj).forEach(code=>{
        const g = document.querySelector('g.prefecture[data-code="'+code+'"]');
        if(g){ g.style.fill = obj[code]; painted.set(code, obj[code]); }
      });
    }catch(e){}
  }

  const labelBtn = document.getElementById('labelBtn');
  labelBtn.addEventListener('click', function(){
    document.body.classList.toggle('labels-off');
    const off = document.body.classList.contains('labels-off');
    this.classList.toggle('on', !off);
    try{ localStorage.setItem(LABEL_KEY, off ? 'off' : 'on'); }catch(e){}
  });
  // ラベル表示状態を復元
  try{
    if(localStorage.getItem(LABEL_KEY)==='off'){
      document.body.classList.add('labels-off');
      labelBtn.classList.remove('on');
    }
  }catch(e){}

  /* ---------- 塗り処理 ---------- */
  const cnt = document.getElementById('cnt');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const toastDot = document.getElementById('toastDot');
  let toastTimer;

  function showToast(msg, color){
    toastText.textContent = msg;
    toastDot.style.background = color || 'transparent';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1400);
  }
  function updateCount(){ cnt.textContent = painted.size; }

  function paint(g){
    const code = g.getAttribute('data-code');
    const nm = nameOf(g);
    if(eraser){
      g.style.fill = '';
      painted.delete(code);
      showToast(nm + ' を消しました', '#fff');
    }else{
      g.style.fill = current.hex;
      painted.set(code, current.hex);
      showToast(nm + '　' + current.name, current.hex);
    }
    g.classList.add('flash');
    setTimeout(()=>g.classList.remove('flash'), 250);
    updateCount();
    saveState();
  }

  /* ---------- リセット ---------- */
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(painted.size === 0) return;
    if(confirm('すべての色を消して白紙に戻しますか？')){
      prefs.forEach(g=>g.style.fill='');
      painted.clear();
      updateCount();
      saveState();
      showToast('白紙に戻しました', '#fff');
    }
  });

  /* ---------- 起動時に前回の塗り状態を復元 ---------- */
  loadState();
  updateCount();

  /* ---------- 画像として保存 ---------- */
  const mapSvg = document.querySelector('svg.geolonia-svg-map');
  const overlay = document.getElementById('saveOverlay');
  const saveImg = document.getElementById('saveImg');
  const saveDl  = document.getElementById('saveDl');
  const saveNote= document.getElementById('saveNote');
  const saveBtn = document.getElementById('saveBtn');

  function buildStandaloneSvg(){
    // マップを複製
    const clone = mapSvg.cloneNode(true);
    // CSSで付けていた塗り・線を、書き出し用にインライン属性として焼き込む
    // (SVGを画像化するとCSSは適用されないため)
    const origPrefs = mapSvg.querySelectorAll('g.prefecture');
    const clonePrefs = clone.querySelectorAll('g.prefecture');
    clonePrefs.forEach((g,i)=>{
      const fill = origPrefs[i].style.fill || '#ffffff'; // 塗った色、無ければ白
      g.setAttribute('fill', fill);
      g.style.fill = fill;
      g.querySelectorAll('polygon,path').forEach(sh=>{
        sh.setAttribute('stroke', '#3a3a36');
        sh.setAttribute('stroke-width', '1');
      });
    });
    // 県境の内部線(琵琶湖など)を薄いグレーに
    clone.querySelectorAll('.boundary-line').forEach(b=>{
      b.setAttribute('stroke', '#c7c5be');
      b.setAttribute('stroke-width', '1');
      b.setAttribute('stroke-dasharray', '3 4');
      b.setAttribute('fill', 'none');
    });
    // 書き出し用フォントは端末標準の丸ゴシックにフォールバック(Webフォント埋め込み不要)
    clone.querySelectorAll('text.pref-label').forEach(t=>{
      if(document.body.classList.contains('labels-off')){ t.remove(); return; }
      t.setAttribute('font-family', '"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif');
      t.setAttribute('font-weight','700');
      t.setAttribute('fill','#33322e');
      t.setAttribute('stroke','#ffffff');
      t.setAttribute('stroke-width','3');
      t.setAttribute('paint-order','stroke');
      t.setAttribute('stroke-linejoin','round');
      t.setAttribute('text-anchor','middle');
      t.setAttribute('dominant-baseline','central');
    });
    // 中身の実寸にクロップ(余白を切り落とす)
    let bb;
    try { bb = mapSvg.querySelector('g.svg-map').getBBox(); }
    catch(e){ bb = {x:0,y:0,width:1000,height:1000}; }
    const pad = 12;
    const x = bb.x - pad, y = bb.y - pad;
    const w = bb.width + pad*2, h = bb.height + pad*2;
    clone.setAttribute('viewBox', x+' '+y+' '+w+' '+h);
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);
    // 背景色を敷く
    const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('x',x); bg.setAttribute('y',y);
    bg.setAttribute('width',w); bg.setAttribute('height',h);
    bg.setAttribute('fill','#fbfaf7');
    clone.insertBefore(bg, clone.firstChild);
    return {node:clone, w:w, h:h};
  }

  function generateImage(){
    const {node, w, h} = buildStandaloneSvg();
    const xml = new XMLSerializer().serializeToString(node);
    const svg64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    const scale = 3; // 高解像度
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w*scale);
    canvas.height = Math.round(h*scale);
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = function(){
      ctx.fillStyle = '#fbfaf7';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      let url;
      try { url = canvas.toDataURL('image/png'); }
      catch(e){ showToast('画像の生成に失敗しました','#fff'); resetSaveBtn(); return; }
      saveImg.src = url;
      saveDl.href = url;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
      resetSaveBtn();
    };
    img.onerror = function(){ showToast('画像の生成に失敗しました','#fff'); resetSaveBtn(); };
    img.src = svg64;
  }

  function resetSaveBtn(){ saveBtn.disabled=false; saveBtn.textContent='保存'; }

  saveBtn.addEventListener('click', ()=>{
    if(painted.size === 0){ showToast('まだ塗られていません','#fff'); return; }
    saveBtn.disabled=true; saveBtn.textContent='…';
    // 描画反映を待ってから生成
    setTimeout(generateImage, 30);
  });

  function closeOverlay(){
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
    saveImg.src='';
  }
  document.getElementById('saveClose').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeOverlay(); });

  /* ---------- パン・ズーム & タップ判定 ---------- */
  const stage = document.getElementById('stage');
  const pz = document.getElementById('panzoom');
  let scale=1, tx=0, ty=0;
  const MIN=1, MAX=8;
  function apply(){
    const r = stage.getBoundingClientRect();
    const maxTx = 0, minTx = r.width - r.width*scale;
    const maxTy = 0, minTy = r.height - r.height*scale;
    tx = Math.min(maxTx, Math.max(minTx, tx));
    ty = Math.min(maxTy, Math.max(minTy, ty));
    pz.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')';
  }
  function zoomAt(cx, cy, factor){
    const ns = Math.min(MAX, Math.max(MIN, scale*factor));
    const k = ns/scale;
    tx = cx - k*(cx - tx);
    ty = cy - k*(cy - ty);
    scale = ns;
    apply();
  }
  document.getElementById('zin').addEventListener('click', ()=>{
    const r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, 1.5);
  });
  document.getElementById('zout').addEventListener('click', ()=>{
    const r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, 1/1.5);
  });

  /* タッチ後しばらくはマウスイベントを無視する(iOSの二重発火対策) */
  let lastTouchTime = 0;

  let touches = new Map();
  let startDist=0, startScale=1;
  let tapStart=null, moved=false;
  let lastPan=null;

  stage.addEventListener('touchstart', e=>{
    lastTouchTime = Date.now();
    for(const t of e.changedTouches) touches.set(t.identifier, {x:t.clientX,y:t.clientY});
    if(touches.size===1){
      const t = e.changedTouches[0];
      tapStart = {x:t.clientX, y:t.clientY, time:Date.now()};
      moved=false;
      lastPan = {x:t.clientX, y:t.clientY};
    }else if(touches.size===2){
      const pts=[...touches.values()];
      startDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      startScale = scale;
      tapStart=null;
    }
  }, {passive:false});

  stage.addEventListener('touchmove', e=>{
    e.preventDefault();
    lastTouchTime = Date.now();
    for(const t of e.changedTouches){
      if(touches.has(t.identifier)) touches.set(t.identifier, {x:t.clientX,y:t.clientY});
    }
    const pts=[...touches.values()];
    if(pts.length===1){
      const t=pts[0];
      if(tapStart && Math.hypot(t.x-tapStart.x, t.y-tapStart.y) > 10) moved=true;
      if(lastPan){
        tx += t.x-lastPan.x; ty += t.y-lastPan.y;
        lastPan={x:t.x,y:t.y};
        apply();
      }
    }else if(pts.length===2){
      const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const r = stage.getBoundingClientRect();
      const cx=(pts[0].x+pts[1].x)/2 - r.left, cy=(pts[0].y+pts[1].y)/2 - r.top;
      const target = Math.min(MAX, Math.max(MIN, startScale * d/startDist));
      zoomAt(cx, cy, target/scale);
    }
  }, {passive:false});

  stage.addEventListener('touchend', e=>{
    e.preventDefault(); // 後続のmousedown/click合成を止める(塗り直後に戻るバグの修正)
    lastTouchTime = Date.now();
    for(const t of e.changedTouches) touches.delete(t.identifier);
    if(tapStart && !moved && touches.size===0 && Date.now()-tapStart.time < 500){
      const el = document.elementFromPoint(tapStart.x, tapStart.y);
      const g = el && el.closest ? el.closest('g.prefecture') : null;
      if(g) paint(g);
    }
    if(touches.size===0){ tapStart=null; lastPan=null; }
    else if(touches.size===1){ const p=[...touches.values()][0]; lastPan={x:p.x,y:p.y}; }
  }, {passive:false});

  stage.addEventListener('touchcancel', ()=>{
    touches.clear(); tapStart=null; lastPan=null;
  });

  /* PC(マウス)用 — タッチ直後800ms以内の合成イベントは無視 */
  let mouseDown=null, mouseMoved=false;
  function isGhost(){ return Date.now() - lastTouchTime < 800; }
  stage.addEventListener('mousedown', e=>{
    if(isGhost()) return;
    mouseDown={x:e.clientX,y:e.clientY}; mouseMoved=false;
  });
  stage.addEventListener('mousemove', e=>{
    if(isGhost() || !mouseDown) return;
    if(Math.hypot(e.clientX-mouseDown.x, e.clientY-mouseDown.y)>6) mouseMoved=true;
    if(mouseMoved){ tx+=e.movementX; ty+=e.movementY; apply(); }
  });
  stage.addEventListener('mouseup', e=>{
    if(isGhost()){ mouseDown=null; return; }
    if(mouseDown && !mouseMoved){
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('g.prefecture') : null;
      if(g) paint(g);
    }
    mouseDown=null;
  });
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.15:1/1.15);
  }, {passive:false});
})();
</script>
