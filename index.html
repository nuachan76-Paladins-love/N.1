<style>
  :root{
    --sumi:#1c1c1a;
    --shiro:#fbfaf7;
    --usuzumi:#8a8a84;
    --keisen:#d8d6cf;
    --base-fill:#ffffff;
    --maru:"Zen Maru Gothic","Hiragino Maru Gothic ProN","HG丸ｺﾞｼｯｸM-PRO","Yu Gothic",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--shiro);
    color:var(--sumi);
    display:flex;flex-direction:column;
    height:100dvh;
    user-select:none;-webkit-user-select:none;
  }

  header{
    display:flex;align-items:center;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    border-bottom:1px solid var(--keisen);
    background:var(--shiro);
    z-index:10;
  }
  header h1{
    font-family:var(--maru);
    font-size:16px;font-weight:700;letter-spacing:.04em;
    white-space:nowrap;flex:0 1 auto;min-width:0;
  }
  .count{
    font-size:12px;color:#6e6d67;letter-spacing:.04em;
    margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto;
  }
  .count b{color:var(--sumi);font-size:15px;font-weight:700}
  .hbtn{
    border:1.5px solid #b0aea5;background:#ffffff;color:#45443f;
    font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;letter-spacing:.04em;
    font-family:inherit;white-space:nowrap;flex:0 0 auto;
  }
  .hbtn:active{background:#eeece6}
  .hbtn.on{background:var(--sumi);color:#fff;border-color:var(--sumi)}
  .hbtn:disabled{opacity:.5}

  /* 保存オーバーレイ */
  #saveOverlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(28,28,26,.55);
    display:none;align-items:center;justify-content:center;
    padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  #saveOverlay.show{display:flex}
  .save-card{
    background:var(--shiro);border-radius:18px;
    width:100%;max-width:460px;max-height:100%;
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .save-head{
    display:flex;align-items:center;gap:8px;
    padding:14px 16px 10px;border-bottom:1px solid var(--keisen);
  }
  .save-title{font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.1em}
  .save-close{
    margin-left:auto;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--keisen);background:transparent;color:var(--usuzumi);
    font-size:18px;line-height:1;
  }
  .save-close:active{background:#eeece6}
  .save-note{
    font-family:var(--maru);font-size:12px;color:var(--usuzumi);
    line-height:1.7;padding:10px 16px 4px;
  }
  .save-imgwrap{
    flex:1;overflow:auto;padding:4px 16px 12px;
    display:flex;align-items:center;justify-content:center;
  }
  #saveImg{
    max-width:100%;height:auto;border-radius:10px;
    border:1px solid var(--keisen);background:#fff;
    -webkit-touch-callout:default;
  }
  .save-dl{
    display:block;text-align:center;text-decoration:none;
    font-family:var(--maru);font-weight:700;font-size:14px;letter-spacing:.08em;
    background:var(--sumi);color:#fff;
    padding:14px;margin:0 16px calc(16px + env(safe-area-inset-bottom));
    border-radius:999px;
  }
  .save-dl:active{opacity:.85}

  #stage{
    flex:1;position:relative;overflow:hidden;
    touch-action:none;
    background:
      radial-gradient(circle at 30% 20%, #ffffff 0%, transparent 60%),
      var(--shiro);
  }
  #panzoom{position:absolute;inset:0;transform-origin:0 0}
  svg.geolonia-svg-map{width:100%;height:100%;display:block}
  .prefecture{fill:var(--base-fill);cursor:pointer}
  .prefecture polygon,.prefecture path{stroke:#3a3a36;stroke-width:1}
  .prefecture.flash polygon,.prefecture.flash path{stroke:#000;stroke-width:2.4}
  .boundary-line{stroke:#b9b7af;stroke-dasharray:3 4}

  .pref-label{
    font-family:var(--maru);
    font-weight:700;
    fill:#33322e;
    stroke:#ffffff;stroke-width:3;
    paint-order:stroke;
    stroke-linejoin:round;
    pointer-events:none;
    text-anchor:middle;
    dominant-baseline:central;
  }
  body.labels-off .pref-label{display:none}

  .zoom-ctrl{
    position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:5;
  }
  .zoom-ctrl button{
    width:40px;height:40px;border-radius:50%;
    border:1px solid var(--keisen);background:rgba(255,255,255,.92);
    font-size:20px;color:var(--sumi);line-height:1;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
  }
  .zoom-ctrl button:active{background:#eeece6}

  #toast{
    position:absolute;left:50%;top:12px;transform:translateX(-50%) translateY(-6px);
    background:rgba(28,28,26,.88);color:#fff;
    font-size:12px;letter-spacing:.1em;
    padding:7px 16px;border-radius:999px;
    opacity:0;transition:opacity .18s,transform .18s;
    pointer-events:none;white-space:nowrap;z-index:6;
    font-family:var(--maru);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:-1px;border:1px solid rgba(255,255,255,.5)}

  .tray{
    border-top:1px solid var(--keisen);
    background:var(--shiro);
    padding:10px 0 max(10px, env(safe-area-inset-bottom));
  }
  .tray-scroll{
    display:flex;gap:6px;overflow-x:auto;padding:2px 14px 4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .tray-scroll::-webkit-scrollbar{display:none}
  .swatch{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;
    background:none;border:none;font-family:inherit;padding:4px 5px;border-radius:10px;
  }
  .swatch .chip{
    width:38px;height:38px;border-radius:50%;
    border:1.5px solid rgba(0,0,0,.12);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);
    transition:transform .12s;
  }
  .swatch .nm{
    font-size:10px;color:var(--usuzumi);letter-spacing:.04em;white-space:nowrap;
    font-family:var(--maru);
  }
  .swatch.sel .chip{transform:scale(1.12);border-color:var(--sumi);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 0 2px var(--shiro),0 0 0 3.5px var(--sumi)}
  .swatch.sel .nm{color:var(--sumi);font-weight:700}
  .chip.eraser{
    background:
      linear-gradient(135deg, transparent 46%, #c0392b 46%, #c0392b 54%, transparent 54%),
      #fff;
  }
  .chip.custom-chip{position:relative;overflow:hidden;background:conic-gradient(#e74c3c,#f39c12,#f1c40f,#2ecc71,#3498db,#9b59b6,#e74c3c)}
  .chip.custom-chip input{
    position:absolute;inset:-8px;width:60px;height:60px;opacity:0;border:none;padding:0;
  }

  /* ===== 旅モード関連 ===== */
  .bottombar{border-top:1px solid var(--keisen);background:var(--shiro);padding-bottom:max(8px,env(safe-area-inset-bottom));}
  .modeseg{display:flex;gap:6px;padding:8px 14px 6px;}
  .modebtn{
    flex:1;border:1.5px solid #b0aea5;background:#fff;color:#45443f;
    font-family:var(--maru);font-weight:700;font-size:13px;letter-spacing:.06em;
    padding:9px 0;border-radius:999px;
  }
  .modebtn.active{background:var(--sumi);color:#fff;border-color:var(--sumi)}
  .modebtn:active{opacity:.85}
  body.mode-travel .paint-only{display:none}
  body:not(.mode-travel) .travel-only{display:none}
  .tray{border-top:none !important;padding-top:2px}
  .travelbar{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 14px 8px}
  .bigbtn{
    width:100%;max-width:420px;border:none;background:#2f7d52;color:#fff;
    font-family:var(--maru);font-weight:700;font-size:15px;letter-spacing:.06em;
    padding:13px;border-radius:14px;
  }
  .bigbtn:active{opacity:.88}
  .travel-hint{font-family:var(--maru);font-size:11px;color:var(--usuzumi);letter-spacing:.04em}

  /* 地図上の写真バッジ */
  .photo-badge{pointer-events:none}
  body:not(.mode-travel) .photo-badge{display:none}

  /* 詳細シート */
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(28,28,26,.5);display:none;align-items:flex-end;justify-content:center;}
  .sheet.show{display:flex}
  .sheet-card{background:var(--shiro);width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -6px 30px rgba(0,0,0,.25);}
  .sheet-head{display:flex;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--keisen)}
  .sheet-title{font-family:var(--maru);font-weight:700;font-size:17px;letter-spacing:.08em}
  .sheet-close{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--keisen);background:transparent;color:var(--usuzumi);font-size:18px;line-height:1}
  .sheet-close:active{background:#eeece6}
  .sheet-actions{display:flex;gap:8px;padding:12px 16px 6px}
  .shopbtn{flex:1;text-align:center;text-decoration:none;font-family:var(--maru);font-weight:700;font-size:13px;padding:12px 6px;border-radius:12px;letter-spacing:.03em}
  .shopbtn.tabelog{background:#f5f0e6;color:#9a6a2f;border:1.5px solid #e4d9c3}
  .shopbtn.gmap{background:#eaf2f7;color:#2a6b8f;border:1.5px solid #cfe0ea}
  .shopbtn:active{opacity:.85}
  .sheet-photos-head{display:flex;align-items:center;padding:12px 16px 6px;font-family:var(--maru);font-size:13px;color:#45443f}
  .sheet-photos-head b{font-size:15px;margin-left:3px}
  .addhere{margin-left:auto;border:1.5px solid #b0aea5;background:#fff;color:#45443f;font-family:var(--maru);font-weight:700;font-size:12px;padding:6px 11px;border-radius:999px}
  .addhere:active{background:#eeece6}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px 16px 16px;overflow-y:auto}
  .pthumb{position:relative;aspect-ratio:1/1;border-radius:9px;overflow:hidden;background:#eceae3}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-empty{font-family:var(--maru);font-size:12px;color:var(--usuzumi);text-align:center;padding:18px 16px 26px;line-height:1.7}

  /* 写真ビューア */
  .viewer{position:fixed;inset:0;z-index:60;background:rgba(10,10,9,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
  .viewer.show{display:flex}
  .viewer img{max-width:100%;max-height:78vh;border-radius:10px;object-fit:contain}
  .viewer-close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:22px}
  .viewer-del{margin-top:16px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-family:var(--maru);font-weight:700;font-size:13px;padding:10px 18px;border-radius:999px}
  .viewer-del:active{background:rgba(255,255,255,.12)}

  /* 取り込み中・サマリー */
  #procOverlay{position:fixed;inset:0;z-index:70;background:rgba(28,28,26,.55);display:none;align-items:center;justify-content:center}
  #procOverlay.show{display:flex}
  .proc-card{background:var(--shiro);border-radius:14px;padding:22px 28px;font-family:var(--maru);font-weight:700;font-size:14px;color:var(--sumi);display:flex;align-items:center;gap:12px}
  .spinner{width:20px;height:20px;border:3px solid #d8d6cf;border-top-color:#2f7d52;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #sumOverlay{position:fixed;inset:0;z-index:72;background:rgba(28,28,26,.55);display:none;align-items:center;justify-content:center;padding:20px}
  #sumOverlay.show{display:flex}
  .sum-card{background:var(--shiro);border-radius:16px;max-width:420px;width:100%;padding:20px 20px 16px;font-family:var(--maru);color:var(--sumi)}
  .sum-card h3{font-size:15px;font-weight:700;margin-bottom:8px;letter-spacing:.06em}
  #sumBody{font-size:13px;line-height:1.7}
  .sum-list{margin-top:8px;padding:10px 12px;background:#f1efe8;border-radius:10px;font-size:12px;line-height:1.9}
  .sum-note{margin-top:10px;font-size:11.5px;color:#9a6a2f;line-height:1.7}
  .sum-ok{display:block;width:100%;margin-top:14px;border:none;background:var(--sumi);color:#fff;font-family:var(--maru);font-weight:700;font-size:13px;padding:11px;border-radius:999px}

</style>
</head>

  /* ---------- 伝統色パレット ---------- */
  const COLORS = [
    {name:'茜色',   hex:'#B7282E'},
    {name:'橙色',   hex:'#EE7800'},
    {name:'山吹色', hex:'#F8B500'},
    {name:'若竹色', hex:'#68BE8D'},
    {name:'常磐色', hex:'#007B43'},
    {name:'浅葱色', hex:'#00A3AF'},
    {name:'藍色',   hex:'#165E83'},
    {name:'藤色',   hex:'#8B81C3'},
    {name:'桜色',   hex:'#F4B3C2'},
    {name:'葡萄色', hex:'#640125'},
    {name:'鈍色',   hex:'#727171'},
  ];
  let current = {name:'茜色', hex:'#B7282E'};
  let eraser = false;
  const painted = new Map();

  /* ---------- トレイ生成 ---------- */
  const tray = document.getElementById('tray');
  function mkSwatch(inner, nm){
    const b = document.createElement('button');
    b.className = 'swatch';
    b.innerHTML = inner + '<span class="nm">'+nm+'</span>';
    tray.appendChild(b);
    return b;
  }
  const swatchEls = [];
  COLORS.forEach(c=>{
    const b = mkSwatch('<span class="chip" style="background:'+c.hex+'"></span>', c.name);
    b.addEventListener('click', ()=>{ current=c; eraser=false; select(b); });
    swatchEls.push(b);
  });
  const customBtn = mkSwatch('<span class="chip custom-chip"><input type="color" id="customColor" value="#ff6600"></span>', '自由な色');
  swatchEls.push(customBtn);
  const customInput = customBtn.querySelector('input');
  customInput.addEventListener('input', e=>{
    current = {name:'自由な色', hex:e.target.value};
    eraser=false; select(customBtn);
    customBtn.querySelector('.chip').style.background = e.target.value;
  });
  customBtn.addEventListener('click', ()=>{
    current = {name:'自由な色', hex:customInput.value};
    eraser=false; select(customBtn);
  });
  const eraserBtn = mkSwatch('<span class="chip eraser"></span>', '消す');
  swatchEls.push(eraserBtn);
  eraserBtn.addEventListener('click', ()=>{ eraser=true; select(eraserBtn); });

  function select(el){ swatchEls.forEach(s=>s.classList.toggle('sel', s===el)); }
  select(swatchEls[0]);

  /* ---------- 県名ラベル(SVGに埋め込み済み)+ トグル ---------- */
  const prefs = Array.from(document.querySelectorAll('g.prefecture'));
  function nameOf(g){
    const t = g.querySelector('title');
    return t ? t.textContent.split('/')[0].trim() : '';
  }
  /* ---------- 保存(端末内に塗り状態を記録) ---------- */
  const STORE_KEY = 'nurie-japan-v1';
  const LABEL_KEY = 'nurie-japan-labels-v1';
  function saveState(){
    try{
      const obj = {};
      painted.forEach((hex,code)=>{ obj[code]=hex; });
      localStorage.setItem(STORE_KEY, JSON.stringify(obj));
    }catch(e){ /* プライベートモード等では保存できないことがある */ }
  }
  function loadState(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return;
      const obj = JSON.parse(raw);
      Object.keys(obj).forEach(code=>{
        const g = document.querySelector('g.prefecture[data-code="'+code+'"]');
        if(g){ g.style.fill = obj[code]; painted.set(code, obj[code]); }
      });
    }catch(e){}
  }

  const labelBtn = document.getElementById('labelBtn');
  labelBtn.addEventListener('click', function(){
    document.body.classList.toggle('labels-off');
    const off = document.body.classList.contains('labels-off');
    this.classList.toggle('on', !off);
    try{ localStorage.setItem(LABEL_KEY, off ? 'off' : 'on'); }catch(e){}
  });
  // ラベル表示状態を復元
  try{
    if(localStorage.getItem(LABEL_KEY)==='off'){
      document.body.classList.add('labels-off');
      labelBtn.classList.remove('on');
    }
  }catch(e){}

  /* ---------- 塗り処理 ---------- */
  const cnt = document.getElementById('cnt');
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  const toastDot = document.getElementById('toastDot');
  let toastTimer;

  function showToast(msg, color){
    toastText.textContent = msg;
    toastDot.style.background = color || 'transparent';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1400);
  }
  function updateCount(){ cnt.textContent = painted.size; }

  function paint(g){

  function buildStandaloneSvg(){
    // マップを複製
    const clone = mapSvg.cloneNode(true);
    // CSSで付けていた塗り・線を、書き出し用にインライン属性として焼き込む
    // (SVGを画像化するとCSSは適用されないため)
    const origPrefs = mapSvg.querySelectorAll('g.prefecture');
    const clonePrefs = clone.querySelectorAll('g.prefecture');
    clonePrefs.forEach((g,i)=>{
      const fill = origPrefs[i].style.fill || '#ffffff'; // 塗った色、無ければ白
      g.setAttribute('fill', fill);
      g.style.fill = fill;
      g.querySelectorAll('polygon,path').forEach(sh=>{
        sh.setAttribute('stroke', '#3a3a36');
        sh.setAttribute('stroke-width', '1');
      });
    });
    // 写真バッジは保存画像から除外
    clone.querySelectorAll('.photo-badge').forEach(b=>b.remove());
    // 県境の内部線(琵琶湖など)を薄いグレーに
    clone.querySelectorAll('.boundary-line').forEach(b=>{
      b.setAttribute('stroke', '#c7c5be');
      b.setAttribute('stroke-width', '1');
      b.setAttribute('stroke-dasharray', '3 4');
      b.setAttribute('fill', 'none');
    });
    // 書き出し用フォントは端末標準の丸ゴシックにフォールバック(Webフォント埋め込み不要)
    clone.querySelectorAll('text.pref-label').forEach(t=>{
      if(document.body.classList.contains('labels-off')){ t.remove(); return; }
      t.setAttribute('font-family', '"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif');
      t.setAttribute('font-weight','700');
      t.setAttribute('fill','#33322e');
      t.setAttribute('stroke','#ffffff');
      t.setAttribute('stroke-width','3');
      t.setAttribute('paint-order','stroke');
      t.setAttribute('stroke-linejoin','round');
      t.setAttribute('text-anchor','middle');
      t.setAttribute('dominant-baseline','central');
    });
    // 中身の実寸にクロップ(余白を切り落とす)
    let bb;
    try { bb = mapSvg.querySelector('g.svg-map').getBBox(); }
    catch(e){ bb = {x:0,y:0,width:1000,height:1000}; }
    const pad = 12;
    const x = bb.x - pad, y = bb.y - pad;
    const w = bb.width + pad*2, h = bb.height + pad*2;
    clone.setAttribute('viewBox', x+' '+y+' '+w+' '+h);
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);
    // 背景色を敷く
    const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
    bg.setAttribute('x',x); bg.setAttribute('y',y);
    bg.setAttribute('width',w); bg.setAttribute('height',h);
    bg.setAttribute('fill','#fbfaf7');
    clone.insertBefore(bg, clone.firstChild);
    return {node:clone, w:w, h:h};
  }

  function generateImage(){
    const {node, w, h} = buildStandaloneSvg();
    const xml = new XMLSerializer().serializeToString(node);
    const svg64 = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    const scale = 3; // 高解像度
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w*scale);
    canvas.height = Math.round(h*scale);
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = function(){
      ctx.fillStyle = '#fbfaf7';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      let url;
      try { url = canvas.toDataURL('image/png'); }
      catch(e){ showToast('画像の生成に失敗しました','#fff'); resetSaveBtn(); return; }
      saveImg.src = url;
      saveDl.href = url;
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden','false');
      resetSaveBtn();
    };
    img.onerror = function(){ showToast('画像の生成に失敗しました','#fff'); resetSaveBtn(); };
    img.src = svg64;
  }

  /* ---------- パン・ズーム & タップ判定 ---------- */
  const stage = document.getElementById('stage');
  const pz = document.getElementById('panzoom');
  let scale=1, tx=0, ty=0;
  const MIN=1, MAX=8;
  function apply(){
    const r = stage.getBoundingClientRect();
    const maxTx = 0, minTx = r.width - r.width*scale;
    const maxTy = 0, minTy = r.height - r.height*scale;
    tx = Math.min(maxTx, Math.max(minTx, tx));
    ty = Math.min(maxTy, Math.max(minTy, ty));
    pz.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')';
  }
  function zoomAt(cx, cy, factor){
    const ns = Math.min(MAX, Math.max(MIN, scale*factor));
    const k = ns/scale;
    tx = cx - k*(cx - tx);
    ty = cy - k*(cy - ty);
    scale = ns;
    apply();
  }
  document.getElementById('zin').addEventListener('click', ()=>{
    const r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, 1.5);
  });
  document.getElementById('zout').addEventListener('click', ()=>{
    const r = stage.getBoundingClientRect();
    zoomAt(r.width/2, r.height/2, 1/1.5);
  });

  /* タッチ後しばらくはマウスイベントを無視する(iOSの二重発火対策) */
  let lastTouchTime = 0;

  let touches = new Map();
  let startDist=0, startScale=1;
  let tapStart=null, moved=false;
  let lastPan=null;

  stage.addEventListener('touchstart', e=>{
    lastTouchTime = Date.now();
    for(const t of e.changedTouches) touches.set(t.identifier, {x:t.clientX,y:t.clientY});
    if(touches.size===1){
      const t = e.changedTouches[0];
      tapStart = {x:t.clientX, y:t.clientY, time:Date.now()};
      moved=false;
      lastPan = {x:t.clientX, y:t.clientY};
    }else if(touches.size===2){
      const pts=[...touches.values()];
      startDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      startScale = scale;
      tapStart=null;
    }
  }, {passive:false});

  stage.addEventListener('touchmove', e=>{
    e.preventDefault();
    lastTouchTime = Date.now();
    for(const t of e.changedTouches){
      if(touches.has(t.identifier)) touches.set(t.identifier, {x:t.clientX,y:t.clientY});
    }
    const pts=[...touches.values()];
    if(pts.length===1){
      const t=pts[0];
      if(tapStart && Math.hypot(t.x-tapStart.x, t.y-tapStart.y) > 10) moved=true;
      if(lastPan){
        tx += t.x-lastPan.x; ty += t.y-lastPan.y;
        lastPan={x:t.x,y:t.y};
        apply();
      }
    }else if(pts.length===2){
      const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      const r = stage.getBoundingClientRect();
      const cx=(pts[0].x+pts[1].x)/2 - r.left, cy=(pts[0].y+pts[1].y)/2 - r.top;
      const target = Math.min(MAX, Math.max(MIN, startScale * d/startDist));
      zoomAt(cx, cy, target/scale);
    }
  }, {passive:false});

  stage.addEventListener('touchend', e=>{
    e.preventDefault(); // 後続のmousedown/click合成を止める(塗り直後に戻るバグの修正)
    lastTouchTime = Date.now();
    for(const t of e.changedTouches) touches.delete(t.identifier);
    if(tapStart && !moved && touches.size===0 && Date.now()-tapStart.time < 500){
      const el = document.elementFromPoint(tapStart.x, tapStart.y);
      const g = el && el.closest ? el.closest('g.prefecture') : null;
      if(g) onPrefTap(g);
    }
    if(touches.size===0){ tapStart=null; lastPan=null; }
    else if(touches.size===1){ const p=[...touches.values()][0]; lastPan={x:p.x,y:p.y}; }
  }, {passive:false});

  stage.addEventListener('touchcancel', ()=>{
    touches.clear(); tapStart=null; lastPan=null;
  });

  /* PC(マウス)用 — タッチ直後800ms以内の合成イベントは無視 */
  let mouseDown=null, mouseMoved=false;
  function isGhost(){ return Date.now() - lastTouchTime < 800; }
  stage.addEventListener('mousedown', e=>{
    if(isGhost()) return;
    mouseDown={x:e.clientX,y:e.clientY}; mouseMoved=false;
  });
  stage.addEventListener('mousemove', e=>{
    if(isGhost() || !mouseDown) return;
    if(Math.hypot(e.clientX-mouseDown.x, e.clientY-mouseDown.y)>6) mouseMoved=true;
    if(mouseMoved){ tx+=e.movementX; ty+=e.movementY; apply(); }
  });
  stage.addEventListener('mouseup', e=>{
    if(isGhost()){ mouseDown=null; return; }
    if(mouseDown && !mouseMoved){
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const g = el && el.closest ? el.closest('g.prefecture') : null;
      if(g) onPrefTap(g);
    }
    mouseDown=null;
  });
  stage.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.15:1/1.15);
  }, {passive:false});

  /* --- 緯度経度 → 県コード(point in polygon) --- */
  function pointInPoly(lon,lat,geom){
    var polys = geom.type==='MultiPolygon' ? geom.coordinates : [geom.coordinates];
    for(var p=0;p<polys.length;p++){
      var ring=polys[p][0], inside=false, n=ring.length, j=n-1;
      for(var i=0;i<n;i++){
        var xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
        if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi+1e-12)+xi)) inside=!inside;
        j=i;
      }
      if(inside) return true;
    }
    return false;
  }
  function whichPref(lat,lng){
    var F = PREF_GEO.f;
    for(var k=0;k<F.length;k++){ if(pointInPoly(lng,lat,F[k].g)) return F[k].i; }
    return null;
  }

  /* --- JPEGのEXIFからGPSを取得 --- */
  function readGpsFromJpeg(buf){
    var dv=new DataView(buf);
    if(dv.getUint16(0)!==0xFFD8) return null;
    var off=2, len=dv.byteLength;
    while(off<len){
      if(dv.getUint16(off)!==0xFFE1){
        if((dv.getUint16(off)&0xFF00)!==0xFF00) break;
        off += 2+dv.getUint16(off+2); continue;
      }
      var app1Len=dv.getUint16(off+2), exifStart=off+4;
      if(dv.getUint32(exifStart)!==0x45786966){ off+=2+app1Len; continue; }
      var tiff=exifStart+6, little=dv.getUint16(tiff)===0x4949;
      var u16=function(o){return dv.getUint16(o,little);};
      var u32=function(o){return dv.getUint32(o,little);};
      var ifd0=tiff+u32(tiff+4), n0=u16(ifd0), gpsPtr=0;
      for(var i=0;i<n0;i++){ var e=ifd0+2+i*12; if(u16(e)===0x8825){ gpsPtr=tiff+u32(e+8); break; } }
      if(!gpsPtr) return null;
      var ng=u16(gpsPtr), latRef,lonRef,lat,lon;
      var readR=function(e,c){ var vo=tiff+u32(e+8),a=[]; for(var k=0;k<c;k++){ var nu=u32(vo+k*8),de=u32(vo+k*8+4); a.push(de?nu/de:0);} return a; };
      var readA=function(e){ var cnt=u32(e+4), o=cnt<=4?e+8:tiff+u32(e+8); return String.fromCharCode(dv.getUint8(o)); };
      for(var g=0;g<ng;g++){
        var ee=gpsPtr+2+g*12, tag=u16(ee);
        if(tag===1) latRef=readA(ee);
        else if(tag===2) lat=readR(ee,3);
        else if(tag===3) lonRef=readA(ee);
        else if(tag===4) lon=readR(ee,3);
      }
      if(!lat||!lon) return null;
      var la=lat[0]+lat[1]/60+lat[2]/3600, lo=lon[0]+lon[1]/60+lon[2]/3600;
      if(latRef==='S') la=-la; if(lonRef==='W') lo=-lo;
      return {lat:la,lng:lo};
    }
    return null;
  }

  /* --- IndexedDB(写真保存) --- */
  var pdb=null;
  function openPhotoDB(){
    return new Promise(function(res,rej){
      var r=indexedDB.open('nurie-photos',1);
      r.onupgradeneeded=function(e){ var d=e.target.result; var s=d.createObjectStore('photos',{keyPath:'id',autoIncrement:true}); s.createIndex('pref','pref',{unique:false}); };
      r.onsuccess=function(e){ pdb=e.target.result; res(pdb); };
      r.onerror=function(){ res(null); };
    });
  }
  function dbAdd(rec){ return new Promise(function(res,rej){ try{ var t=pdb.transaction('photos','readwrite'); var rq=t.objectStore('photos').add(rec); rq.onsuccess=function(e){res(e.target.result);}; t.onerror=function(){rej(t.error);}; }catch(e){rej(e);} }); }
  function dbByPref(code){ return new Promise(function(res){ var out=[]; try{ var idx=pdb.transaction('photos','readonly').objectStore('photos').index('pref'); var rq=idx.openCursor(IDBKeyRange.only(code)); rq.onsuccess=function(e){ var c=e.target.result; if(c){ out.push(c.value); c.continue(); } else res(out); }; rq.onerror=function(){res(out);}; }catch(e){res(out);} }); }
  function dbDelete(id){ return new Promise(function(res){ try{ var t=pdb.transaction('photos','readwrite'); t.objectStore('photos').delete(id).onsuccess=function(){res();}; t.onerror=function(){res();}; }catch(e){res();} }); }
  function dbCounts(){ return new Promise(function(res){ var c={}; try{ var rq=pdb.transaction('photos','readonly').objectStore('photos').openCursor(); rq.onsuccess=function(e){ var cur=e.target.result; if(cur){ c[cur.value.pref]=(c[cur.value.pref]||0)+1; cur.continue(); } else res(c); }; rq.onerror=function(){res(c);}; }catch(e){res(c);} }); }

  /* --- 画像を縮小してJPEG Blobに --- */
  function downscale(file, maxDim){
    return new Promise(function(res){
      var img=new Image();
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight;
        var s=Math.min(1, maxDim/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*s)), ch=Math.max(1,Math.round(h*s));
        var c=document.createElement('canvas'); c.width=cw; c.height=ch;
        c.getContext('2d').drawImage(img,0,0,cw,ch);
        URL.revokeObjectURL(img.src);
        if(c.toBlob) c.toBlob(function(b){res(b);},'image/jpeg',0.82);
        else { try{ var durl=c.toDataURL('image/jpeg',0.82); fetch(durl).then(function(r){return r.blob();}).then(res); }catch(e){res(null);} }
      };
      img.onerror=function(){ URL.revokeObjectURL(img.src); res(null); };
      img.src=URL.createObjectURL(file);
    });
  }

  /* --- 写真の取り込み処理 --- */
  var procEl=document.getElementById('procOverlay');
  var procText=document.getElementById('procText');
  async function processFiles(fileList, forcedPref){
    var files=[].slice.call(fileList);
    if(!files.length) return;
    if(!pdb){ await openPhotoDB(); if(!pdb){ showToast('写真の保存に対応していません','#fff'); return; } }
    var added=0, noloc=0, byPref={};
    procEl.classList.add('show');
    for(var i=0;i<files.length;i++){
      procText.textContent='写真を取り込み中… '+(i+1)+' / '+files.length;
      var f=files[i], pref=forcedPref||null;
      if(!pref){
        try{ var ab=await f.arrayBuffer(); var gps=readGpsFromJpeg(ab); if(gps){ pref=whichPref(gps.lat,gps.lng); } }catch(e){}
      }
      var blob=await downscale(f,1280);
      if(!blob) continue;
      if(pref){ try{ await dbAdd({pref:pref,blob:blob,ts:Date.now()}); added++; byPref[pref]=(byPref[pref]||0)+1; }catch(e){} }
      else { noloc++; }
    }
    procEl.classList.remove('show');
    await refreshPhotoBadges();
    // サマリー
    var parts=[];
    for(var code in byPref){ parts.push((PREF_META[code]?PREF_META[code][1]:code)+' '+byPref[code]); }
    var msg = added>0 ? (added+'枚を振り分けました') : '追加できる写真がありませんでした';
    showToast(msg, '#68BE8D');
    if(noloc>0){
      setTimeout(function(){
        showSummary(added, byPref, noloc);
      }, 400);
    } else if(added>0){
      setTimeout(function(){ showSummary(added, byPref, 0); }, 400);
    }
    // 開いている詳細シートを更新
    if(currentDetailPref!=null) renderPhotos(currentDetailPref);
  }

  function showSummary(added, byPref, noloc){
    var lines=[];
    for(var code in byPref){ lines.push((PREF_META[code]?PREF_META[code][1]:code)+'：'+byPref[code]+'枚'); }
    var html='<b>'+added+'枚</b>を県ごとに振り分けました。';
    if(lines.length) html+='<div class="sum-list">'+lines.join('<br>')+'</div>';
    if(noloc>0) html+='<div class="sum-note">'+noloc+'枚は位置情報がないため振り分けできませんでした。各県を開いて「この県に追加」から取り込めます。</div>';
    sumBody.innerHTML=html;
    sumEl.classList.add('show');
  }

  /* --- 写真バッジ(地図上に撮影済みマーク) --- */
  var badgeLayer=null;
  async function refreshPhotoBadges(){
    if(!pdb) return;
    var counts=await dbCounts();
    // 既存バッジ削除
    document.querySelectorAll('.photo-badge').forEach(function(b){b.remove();});
    var SVGNS='http://www.w3.org/2000/svg';
    for(var codeStr in counts){
      var code=+codeStr;
      var g=document.querySelector('g.prefecture[data-code="'+code+'"]');
      if(!g) continue;
      var label=g.querySelector('text.pref-label');
      if(!label) continue;
      var x=parseFloat(label.getAttribute('x')), y=parseFloat(label.getAttribute('y'));
      var grp=document.createElementNS(SVGNS,'g');
      grp.setAttribute('class','photo-badge');
      grp.setAttribute('transform','translate('+x+','+(y-9)+')');
      var circ=document.createElementNS(SVGNS,'circle');
      circ.setAttribute('r','5.5'); circ.setAttribute('fill','#2f7d52'); circ.setAttribute('stroke','#fff'); circ.setAttribute('stroke-width','1');
      var txt=document.createElementNS(SVGNS,'text');
      txt.setAttribute('text-anchor','middle'); txt.setAttribute('dominant-baseline','central');
      txt.setAttribute('y','0.3'); txt.setAttribute('font-size','5.5'); txt.setAttribute('fill','#fff'); txt.setAttribute('font-weight','700');
      txt.textContent=counts[code];
      grp.appendChild(circ); grp.appendChild(txt);
      g.appendChild(grp);
    }
  }

  /* --- モード切替 --- */
  var modeBtns=document.querySelectorAll('.modebtn');
  function setMode(m){
    document.body.classList.toggle('mode-travel', m==='travel');
    modeBtns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-mode')===m); });
    if(m==='travel') refreshPhotoBadges();
  }
  modeBtns.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.getAttribute('data-mode')); }); });

  /* --- 県タップの振り分け --- */
  function onPrefTap(g){
    if(document.body.classList.contains('mode-travel')) openDetail(g);
    else paint(g);
  }

  /* --- 詳細シート --- */
  var sheet=document.getElementById('detailSheet');
  var detailName=document.getElementById('detailName');
  var photoGrid=document.getElementById('photoGrid');
  var photoEmpty=document.getElementById('photoEmpty');
  var photoCountEl=document.getElementById('photoCount');
  var currentDetailPref=null;
  var objectUrls=[];

  function clearObjectUrls(){ objectUrls.forEach(function(u){URL.revokeObjectURL(u);}); objectUrls=[]; }

  async function renderPhotos(code){
    photoGrid.innerHTML='';
    clearObjectUrls();
    var list = pdb ? await dbByPref(code) : [];
    photoCountEl.textContent=list.length;
    photoEmpty.style.display = list.length? 'none':'block';
    list.sort(function(a,b){return b.ts-a.ts;});
    list.forEach(function(rec){
      var url=URL.createObjectURL(rec.blob); objectUrls.push(url);
      var d=document.createElement('div'); d.className='pthumb';
      var im=document.createElement('img'); im.src=url; im.loading='lazy';
      d.appendChild(im);
      d.addEventListener('click', function(){ openViewer(url, rec.id, code); });
      photoGrid.appendChild(d);
    });
  }

  function openDetail(g){
    var code=+g.getAttribute('data-code');
    currentDetailPref=code;
    var meta=PREF_META[code]||['',nameOf(g)];
    detailName.textContent = nameOf(g);
    // お店リンク
    document.getElementById('tabelogBtn').href='https://tabelog.com/'+meta[0]+'/';
    document.getElementById('gmapBtn').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(meta[1]+' グルメ 人気');
    renderPhotos(code);
    sheet.classList.add('show'); sheet.setAttribute('aria-hidden','false');
  }
  function closeDetail(){ sheet.classList.remove('show'); sheet.setAttribute('aria-hidden','true'); currentDetailPref=null; clearObjectUrls(); }
  document.getElementById('detailClose').addEventListener('click', closeDetail);
  sheet.addEventListener('click', function(e){ if(e.target===sheet) closeDetail(); });

  /* --- 写真ビューア(拡大/削除) --- */
  var viewer=document.getElementById('photoViewer');
  var viewerImg=document.getElementById('viewerImg');
  var viewerDelId=null, viewerDelPref=null;
  function openViewer(url,id,code){ viewerImg.src=url; viewerDelId=id; viewerDelPref=code; viewer.classList.add('show'); viewer.setAttribute('aria-hidden','false'); }
  function closeViewer(){ viewer.classList.remove('show'); viewer.setAttribute('aria-hidden','true'); viewerImg.src=''; }
  document.getElementById('viewerClose').addEventListener('click', closeViewer);
  viewer.addEventListener('click', function(e){ if(e.target===viewer) closeViewer(); });
  document.getElementById('viewerDel').addEventListener('click', async function(){
    if(viewerDelId!=null){ await dbDelete(viewerDelId); closeViewer(); if(currentDetailPref!=null) renderPhotos(currentDetailPref); refreshPhotoBadges(); showToast('写真を削除しました','#fff'); }
  });

  /* --- 写真追加ボタン --- */
  var fileGlobal=document.getElementById('fileGlobal');
  var fileHere=document.getElementById('fileHere');
  document.getElementById('addPhotosBtn').addEventListener('click', function(){ fileGlobal.value=''; fileGlobal.click(); });
  fileGlobal.addEventListener('change', function(){ processFiles(fileGlobal.files, null); });
  document.getElementById('addHereBtn').addEventListener('click', function(){ fileHere.value=''; fileHere.click(); });
  fileHere.addEventListener('change', function(){ if(currentDetailPref!=null) processFiles(fileHere.files, currentDetailPref); });

  /* --- サマリーダイアログ --- */
  var sumEl=document.getElementById('sumOverlay');
  var sumBody=document.getElementById('sumBody');
  document.getElementById('sumClose').addEventListener('click', function(){ sumEl.classList.remove('show'); });
  sumEl.addEventListener('click', function(e){ if(e.target===sumEl) sumEl.classList.remove('show'); });

  /* 起動時にDBを開いてバッジ準備 */
  openPhotoDB();


})();
</script>
</body>
</html>
